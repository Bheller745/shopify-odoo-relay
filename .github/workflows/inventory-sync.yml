name: Inventory sync (Odoo -> Shopify)

# Render's free tier sleeps the web service after inactivity, so an
# in-process background scheduler never survives long enough to fire (see
# the note in app.py near the bottom). This runs the schedule from outside
# instead -- plain HTTP calls to the already-working /admin/inventory-sync
# endpoint, which also has the side effect of keeping the service awake.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Odoo -> Shopify inventory sync
        run: |
          curl -sf -u ":${{ secrets.DASHBOARD_PASSWORD }}" \
            "https://shopify-odoo-relay.onrender.com/admin/inventory-sync"
